<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loop Player</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      /* Hide scrollbars */
      background-color: black;
      /* Ensure black background for full screen */
    }

    #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="player"></div>

  <script>
    let player; // Declare player globally
    const PLAYER_KEY = "loopPlayerCommand"; // Unique key for this player in localStorage (for incoming commands from Controller.html)
    const PLAYER_EVENT_KEY = "loopPlayerEvent"; // Unique key for sending events to Controller.html
    let isLoadingVideo = false; // Flag to prevent videoEnded during loading
    let timeUpdateInterval = null; // 24/7 Reliability: Track interval for cleanup
    // A freshly-constructed YT.Player doesn't have its control methods (playVideo,
    // unMute, etc.) attached until onReady fires — they're wired up async. Commands
    // that land in that gap (e.g. the "play"/"unmute" that immediately follow
    // "loadVideo" when creating a brand-new player) used to throw "is not a function"
    // and get silently swallowed, which could leave the first video of a session
    // muted or never actually playing. Queue them and replay once ready instead.
    let playerReady = false;
    let pendingCommands = [];
    const SOURCE_NAME = "Loop Player";
    // Whether this player is the on-air source right now. Resolved authoritatively
    // from the server's own obs.activeSource state (HTTP once on load, then live over
    // /ws) — see resolveVisibilityFromServer() below — instead of relying only on the
    // controller panel's fire-and-forget "setSourceVisible" localStorage broadcast.
    // That broadcast is sent only on panel mount and on visibility *changes*, so this
    // page missed it entirely whenever it started after the panel (OBS browser-source
    // refresh, exe restart, UnifiedPlayer iframe reload) and then sat gated forever:
    // every loadVideo became a cue and every play was deferred to a transition that
    // never came. `null` = not yet known; commands are held in bootQueue until then.
    let sourceVisible = null;
    let bootQueue = [];
    // The standing intent: true means "this is supposed to be playing". A loadVideo —
    // from anywhere: manual Load, Next/Prev/Jump, playlist automation, end-of-video
    // advance — sets it, and it SURVIVES the load. Only an explicit pause/stop clears
    // it. This is what guarantees a triggered video actually starts: if it had to be
    // cued because the source was hidden, it plays the moment the source goes on air,
    // and the watchdog in the 1s tick re-asserts it if YouTube leaves it sitting cued.
    let playIntent = false;
    let lastVideoId = null;
    // Set when the watchdog fell back to muted playback to get past a browser autoplay
    // block; cleared (and audio restored) once the video is genuinely rolling.
    let mutedForAutoplay = false;
    let stalledTicks = 0;

    function applyCommand(data) {
      switch (data.command) {
        case "play":
          playIntent = true;
          if (!sourceVisible) {
            console.log("LoopPlayer: Play requested while source is hidden — will start when it goes on air.");
            break;
          }
          console.log("LoopPlayer: Playing video.");
          player.playVideo();
          break;
        case "pause":
          console.log("LoopPlayer: Pausing video.");
          playIntent = false;
          stalledTicks = 0;
          player.pauseVideo();
          break;
        case "stop":
          console.log("LoopPlayer: Stopping and destroying player.");
          playIntent = false;
          stalledTicks = 0;
          player.stopVideo();
          // NOTE: timeUpdateInterval is deliberately NOT cleared here. It is the single
          // page-lifetime tick that also drives the play watchdog and quality pinning,
          // and it already no-ops while `player` is null. Tearing it down on stop meant
          // it never came back for the next video created after a stop.
          player.destroy();
          player = null;
          playerReady = false;
          pendingCommands = [];
          break;
        case "mute":
          console.log("LoopPlayer: Muting video.");
          player.mute();
          break;
        case "unmute":
          console.log("LoopPlayer: Unmuting video.");
          player.unMute();
          break;
        case "setVolume":
          if (typeof data.volume === "number") {
            console.log(`LoopPlayer: Setting volume to ${data.volume}.`);
            player.setVolume(data.volume);
          }
          break;
        case "seekTo":
          if (typeof data.seconds === "number") {
            console.log(`LoopPlayer: Seeking to ${data.seconds} seconds.`);
            player.seekTo(data.seconds, true); // true for allowSeekAhead
          }
          break;
        case "destroy":
          console.log("LoopPlayer: Destroying player.");
          playIntent = false;
          stalledTicks = 0;
          player.destroy();
          player = null;
          playerReady = false;
          pendingCommands = [];
          break;
        case "loadVideo":
          console.log(`LoopPlayer: Loading new video ID: ${data.videoId}`);
          lastVideoId = data.videoId;
          // Loading a video IS a request to play it — that is the rule for every
          // trigger path in this app. When the source is hidden the video is only
          // cued, but the intent is kept so it starts the instant it goes on air.
          playIntent = true;
          stalledTicks = 0;
          if (sourceVisible) {
            player.loadVideoById({ videoId: data.videoId, suggestedQuality: "hd1080" });
          } else {
            // cueVideoById loads without autoplaying — loadVideoById always plays
            // immediately regardless of any "autoplay" field, which is what let
            // videos start in the background while this source was hidden.
            player.cueVideoById({ videoId: data.videoId, suggestedQuality: "hd1080" });
          }
          startQualityBurst();
          break;
      }
    }

    // Single entry point for every inbound command, so the "player doesn't exist yet"
    // and "player exists but onReady hasn't fired" cases are handled in one place
    // instead of being silently dropped by the caller.
    function dispatchCommand(data) {
      if (data.command === "loadVideo" && data.videoId) {
        isLoadingVideo = true;
        lastVideoId = data.videoId;
        playIntent = true; // a load always means "play this" — see applyCommand's loadVideo case
        if (!player) { createPlayer(data.videoId); return; }
        if (!playerReady) { pendingCommands.push(data); return; }
        applyCommand(data);
        return;
      }

      if (!player) {
        // A play/unmute/seek with no live player used to vanish here — which is why
        // pressing Play after a Stop did nothing at all. Rebuild from the last known
        // video instead so playback can always be resumed.
        if (data.command === "play" && lastVideoId) {
          console.log("LoopPlayer: Play with no live player — recreating from last video.");
          playIntent = true;
          createPlayer(lastVideoId);
        }
        return;
      }

      if (!playerReady) { pendingCommands.push(data); return; }
      applyCommand(data);
    }

    function createPlayer(videoId) {
      if (typeof YT === "undefined" || typeof YT.Player === "undefined") {
        // The API script is still downloading. This used to drop the command outright,
        // which lost the very first video whenever a trigger beat the API load.
        console.warn("LoopPlayer: YT API not ready yet — retrying player creation shortly.");
        setTimeout(() => { if (!player) createPlayer(videoId); }, 300);
        return;
      }
      console.log(`LoopPlayer: Creating new player for video ID: ${videoId}`);
      playerReady = false;
      pendingCommands = [];
      stalledTicks = 0;
      player = new YT.Player("player", {
        videoId: videoId,
        playerVars: {
          autoplay: sourceVisible ? 1 : 0,
          controls: 0,
          modestbranding: 1,
          showinfo: 0,
          rel: 0,
          fs: 1,
          iv_load_policy: 3,
          vq: "hd1080", // best-effort initial quality hint — see enforceHighestQuality
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError,
          onPlaybackQualityChange: onQualityChange,
        },
      });
    }

    // Called whenever we learn (or re-learn) whether this is the on-air source.
    function applyVisibility(visible) {
      const first = sourceVisible === null;
      const changed = sourceVisible !== visible;
      sourceVisible = !!visible;
      if (first) {
        const queued = bootQueue;
        bootQueue = [];
        console.log(`LoopPlayer: Visibility resolved (${sourceVisible ? "on air" : "hidden"}) — replaying ${queued.length} held command(s).`);
        queued.forEach(dispatchCommand);
      }
      if (!changed) return;
      if (!player || !playerReady) return;
      if (sourceVisible) {
        // Going on air with a standing play intent — start whatever is cued.
        if (playIntent) { stalledTicks = 0; player.playVideo(); }
      } else {
        player.pauseVideo();
      }
    }

    // Authoritative visibility, straight from the shared state service — the same
    // obs.activeSource key UnifiedPlayer.html watches to decide which player is shown.
    // Independent of the controller panel being open, so this page self-heals on any
    // reload rather than waiting for a broadcast that already happened.
    function resolveVisibilityFromServer() {
      fetch("/api/state/obs.activeSource")
        .then((r) => (r.ok ? r.json() : null))
        .then((d) => {
          const value = d && d.value;
          // No active source recorded yet — Loop Player is this app's default source
          // (same fallback UnifiedPlayer.html uses), so treat that as on air.
          applyVisibility(value ? value === SOURCE_NAME : true);
        })
        .catch(() => applyVisibility(true));

      const connect = () => {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${protocol}//${location.host}/ws`);
        const fromValue = (v) => { if (v) applyVisibility(v === SOURCE_NAME); };
        ws.onmessage = (event) => {
          let msg;
          try { msg = JSON.parse(event.data); } catch (e) { return; }
          if (msg.type === "STATE_SYNC") {
            fromValue(msg.data && msg.data["obs.activeSource"]);
          } else if (msg.type === "STATE_CHANGE") {
            const d = msg.data;
            if (d.type === "SET" && d.key === "obs.activeSource") fromValue(d.value);
            else if (d.type === "SET_MULTIPLE" && Array.isArray(d.changes)) {
              const c = d.changes.find((x) => x.key === "obs.activeSource");
              if (c) fromValue(c.value);
            } else if (d.type === "RESET" && d.state) {
              fromValue(d.state["obs.activeSource"]);
            }
          }
        };
        ws.onclose = () => setTimeout(connect, 3000);
        ws.onerror = () => ws.close();
      };
      connect();

      // Never stay in the "unknown" state — if the server can't be reached at all,
      // fall open to on-air rather than holding commands forever.
      setTimeout(() => { if (sourceVisible === null) applyVisibility(true); }, 3000);
    }

    // Function to load the YouTube IFrame API asynchronously
    function loadYouTubeAPI() {
      const tag = document.createElement("script");
      // Corrected YouTube API URL to ensure the player loads correctly
      tag.src = "https://www.youtube.com/iframe_api"; // Corrected URL
      const firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    // This function is called by the YouTube API when it's ready
    function onYouTubeIframeAPIReady() {
      console.log("YouTube IFrame API is ready for LoopPlayer.");
      // This function is required by the YouTube API.
      // Player creation will happen when a command is received via localStorage.
    }

    // Event listener for changes in localStorage
    window.addEventListener("storage", (event) => {
      if (event.key === PLAYER_KEY && event.newValue) {
        try {
          const data = JSON.parse(event.newValue);
          console.log("LoopPlayer: Command received via localStorage:", data);

          if (data.command === "setSourceVisible") {
            // Still honoured (it's the fastest signal when the panel is open), but no
            // longer the only source of truth — see resolveVisibilityFromServer().
            applyVisibility(!!data.visible);
          } else if (sourceVisible === null) {
            // Visibility not resolved yet (page just loaded). Hold rather than guess,
            // so a command landing in that window can't autoplay off-air — replayed by
            // applyVisibility() a moment later.
            bootQueue.push(data);
          } else {
            dispatchCommand(data);
          }
        } catch (e) {
          console.error("LoopPlayer: Error parsing localStorage command:", e);
        }
      }
    });

    function onPlayerReady(event) {
      console.log("LoopPlayer: Player is ready!");
      playerReady = true;
      if (sourceVisible && playIntent) {
        event.target.playVideo(); // Autoplay on ready — only when actually the visible source
      }
      enforceHighestQuality(event.target);
      startQualityBurst();
      // Replay any play/mute/seek/etc. commands that arrived before the player's
      // control methods were attached, in the order they arrived.
      const queued = pendingCommands;
      pendingCommands = [];
      queued.forEach(applyCommand);
    }

    // YouTube's IFrame API treats quality as a hint, not a guarantee — it can still
    // downgrade under bandwidth pressure. This runs on a fixed gigabit LAN with no
    // such constraint, so always pin to the highest tier YouTube offers for the
    // current video. getAvailableQualityLevels() is sorted highest → lowest (e.g.
    // hd2160, hd1440, hd1080, hd720, large, medium, small, tiny) but is only
    // populated once the video actually starts buffering, so this alone can't
    // always land the very first frame at the top tier — onQualityChange below
    // re-asserts it the moment YouTube reports its own (usually lower) auto-pick.
    function enforceHighestQuality(target) {
      try {
        const levels = target.getAvailableQualityLevels();
        const current = (typeof target.getPlaybackQuality === "function") ? target.getPlaybackQuality() : undefined;
        const pick = (levels && levels.length) ? levels[0] : "highres";
        console.log("[LoopPlayer][Quality] available=[" + (levels || []).join(",") + "] current=" + current + " -> setting=" + pick);
        target.setPlaybackQuality(pick);
      } catch (e) {
        console.warn("LoopPlayer: could not set playback quality:", e);
      }
    }

    // YouTube is most likely to silently downgrade quality in the first few
    // seconds after a video (re)loads, while it's still probing. The 1s backstop
    // in the timeUpdate interval below only catches this every second — during
    // this window, check every 250ms instead so a downgrade gets reverted almost
    // immediately rather than sitting at the wrong tier for up to a second.
    let qualityBurstTimer = null;
    function startQualityBurst() {
      if (qualityBurstTimer) clearInterval(qualityBurstTimer);
      const deadline = Date.now() + 8000;
      qualityBurstTimer = setInterval(() => {
        if (!player || Date.now() > deadline) {
          clearInterval(qualityBurstTimer);
          qualityBurstTimer = null;
          return;
        }
        enforceHighestQuality(player);
      }, 250);
    }

    function onQualityChange(event) {
      if (!player) return;
      const levels = player.getAvailableQualityLevels();
      console.log("[LoopPlayer][Quality] YouTube reported quality change -> " + event.data + " | available=[" + (levels || []).join(",") + "]");
      if (levels && levels.length && event.data !== levels[0]) {
        player.setPlaybackQuality(levels[0]);
      }
    }

    function onPlayerStateChange(event) {
      let state;
      switch (event.data) {
        case YT.PlayerState.ENDED:
          state = "ended";
          // Only report videoEnded if not in loading state
          if (!isLoadingVideo) {
            // Notify Controller.html that video has ended
            localStorage.setItem(
              PLAYER_EVENT_KEY,
              JSON.stringify({ playerType: "loop", event: "videoEnded" })
            );
            setTimeout(() => {
              localStorage.removeItem(PLAYER_EVENT_KEY);
            }, 100);
          } else {
            console.log("LoopPlayer: Ignoring ENDED state during video loading.");
          }
          break;
        case YT.PlayerState.PLAYING:
          state = "playing";
          isLoadingVideo = false; // Video started playing, loading complete
          stalledTicks = 0;
          if (mutedForAutoplay) {
            // We only muted to get past a browser autoplay block; it's rolling now, so
            // give the audio back.
            mutedForAutoplay = false;
            try { player.unMute(); } catch (e) { /* player torn down mid-flight */ }
          }
          startQualityBurst(); // YouTube often re-picks quality right as playback actually starts
          break;
        case YT.PlayerState.PAUSED:
          state = "paused";
          break;
        case YT.PlayerState.BUFFERING:
          state = "buffering";
          startQualityBurst(); // and again when it re-buffers (a common downgrade trigger)
          break;
        case YT.PlayerState.CUED:
          state = "cued";
          break;
        case YT.PlayerState.UNSTARTED:
          state = "unstarted";
          break;
        default:
          state = "unknown";
      }
      console.log("LoopPlayer: State changed to:", state);
    }

    // Function to handle player errors
    function onPlayerError(event) {
      let errorMessage = "Unknown error";
      switch (event.data) {
        case 2:
          errorMessage = "Invalid video ID or video not found.";
          break;
        case 100:
          errorMessage = "Video not found.";
          break;
        case 101:
        case 150:
          errorMessage =
            "Video cannot be played in an embedded player (e.g., private video, restricted playback).";
          break;
      }
      console.error(
        "LoopPlayer: Error:",
        errorMessage,
        "Error code:",
        event.data
      );
      // Notify Controller.html that the video failed to load/play
      localStorage.setItem(
        PLAYER_EVENT_KEY,
        JSON.stringify({
          playerType: "loop",
          event: "videoError",
          errorCode: event.data,
        })
      );
      setTimeout(() => {
        localStorage.removeItem(PLAYER_EVENT_KEY); // Clear the item after a short delay
      }, 100);
    }
    function reportEvent(eventName, data = {}) {
      const eventData = {
        playerType: "loop",
        event: eventName,
        timestamp: Date.now(),
        ...data,
      };
      localStorage.setItem(PLAYER_EVENT_KEY, JSON.stringify(eventData));
      // Clear the item after a short delay to ensure the 'storage' event fires cleanly
      setTimeout(() => {
        localStorage.removeItem(PLAYER_EVENT_KEY);
      }, 100);
    }

    // 24/7 Reliability: Store interval ID for cleanup
    timeUpdateInterval = setInterval(() => {
      // FIX 3: Add a guard clause to ensure the player object exists and is ready
      if (!player || typeof player.getPlayerState !== "function") {
        return;
      }
      // Read duration fresh every tick — caching it once made every later
      // video inherit the first video's duration (and remaining time went
      // negative, which the controller renders as a blank).
      const duration = player.getDuration();
      const currentTime = player.getCurrentTime();
      const playerState = player.getPlayerState();

      // ---- Play watchdog ----
      // The hard guarantee behind "a triggered video must actually start": whenever
      // this source is on air and something asked for playback, a player left sitting
      // in PAUSED/CUED/UNSTARTED is a stall, not a state the operator chose (an
      // explicit pause/stop clears playIntent, so this never fights a real pause).
      // Covers YouTube ignoring the initial autoplay, a cue that never got its play,
      // and a browser autoplay policy silently refusing sound-on playback.
      if (sourceVisible && playIntent && playerReady) {
        const stalled = playerState === YT.PlayerState.PAUSED
          || playerState === YT.PlayerState.CUED
          || playerState === YT.PlayerState.UNSTARTED;
        if (stalled) {
          stalledTicks++;
          if (stalledTicks >= 2) {
            console.warn(`[LoopPlayer][Watchdog] play intended but state=${playerState} for ${stalledTicks}s — forcing playVideo()`);
            player.playVideo();
          }
          if (stalledTicks >= 5 && !mutedForAutoplay && !player.isMuted()) {
            // Still refusing after several seconds: almost always the autoplay policy
            // blocking sound-on playback. Start muted and restore audio on PLAYING.
            console.warn("[LoopPlayer][Watchdog] still stalled — retrying muted to clear autoplay block.");
            mutedForAutoplay = true;
            player.mute();
            player.playVideo();
          }
        } else {
          stalledTicks = 0;
        }
      }

      // getDuration() returns 0 until the video's metadata is loaded — skip until then
      if (playerState === YT.PlayerState.PLAYING && duration > 0) {
        reportEvent("timeUpdate", {
          currentTime,
          duration,
          remainingTime: Math.max(0, duration - currentTime)
        });
        // onPlaybackQualityChange doesn't always fire when YouTube silently
        // holds a video at a lower tier, so piggyback a re-check on this
        // already-running 1s tick as a backstop to the event-driven enforcement.
        // Logged every tick under [Quality] — filter DevTools console on that tag.
        const levels = player.getAvailableQualityLevels();
        const current = player.getPlaybackQuality();
        const target = (levels && levels.length) ? levels[0] : null;
        console.log("[LoopPlayer][Quality] tick current=" + current + " target=" + target + " available=[" + (levels || []).join(",") + "]");
        if (target && current !== target) {
          player.setPlaybackQuality(target);
        }
      }
    }, 1000);

    // Load the YouTube API when the page loads
    loadYouTubeAPI();
    // ...and immediately find out whether we're the on-air source, so this page is
    // never stuck waiting on a controller broadcast it may have already missed.
    resolveVisibilityFromServer();
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delay Live Player</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      /* Hide scrollbars */
      background-color: black;
    }

    #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="player"></div>

  <script>
    let player;
    const PLAYER_KEY = "delayLivePlayerCommand"; // Unique key for this player in localStorage
    const EVENT_REPORT_KEY = "delayLivePlayerEvent"; // Key to report events back to controller
    let durationTimer; // To manage the end time of playback
    let timeUpdateInterval = null; // 24/7 Reliability: Track interval for cleanup
    // Store current start/end seconds in variables (not from localStorage on each play)
    let currentStartSeconds = 0;
    let currentEndSeconds = null;
    // Skip sections (from "setSkipRanges" command): when playback enters
    // [start, end) of any section it seeks ahead to that section's end, so the
    // section is never shown. end === Infinity means "finish the video there"
    // (keyword was the last timestamp). Reset on every loadVideo.
    let skipRanges = []; // sorted [{ start, end }]
    let isLoadingVideo = false; // Flag to prevent videoEnded during loading
    let lastLoadedVideoId = null; // Track last loaded video to prevent duplicate ended events

    // Function to load the YouTube IFrame API asynchronously
    function loadYouTubeAPI() {
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api"; // Corrected YouTube API URL
      const firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    // This function is called by the YouTube API when it's ready
    function onYouTubeIframeAPIReady() {
      console.log("YouTube IFrame API is ready for DelayLivePlayer.");
      // Player will be created when a video is loaded via localStorage command
    }

    function createPlayer(videoId, startSeconds = 0, endSeconds = null) {
      // Store the times in variables for later use
      currentStartSeconds = startSeconds;
      currentEndSeconds = endSeconds;

      if (player) {
        player.destroy();
      }
      player = new YT.Player("player", {
        videoId: videoId,
        playerVars: {
          autoplay: 1, // Autoplay the video
          controls: 0, // Hide video controls
          disablekb: 1, // Disable keyboard controls
          fs: 0, // Disable fullscreen button
          iv_load_policy: 3, // Hide video annotations by default
          modestbranding: 1, // Hide YouTube logo
          rel: 0, // Do not show related videos
          showinfo: 0, // Hide video title and uploader info
          start: startSeconds || 0, // Start time in seconds
          end: endSeconds || undefined, // End time in seconds, or undefined if not set
          vq: "hd1080", // best-effort initial quality hint — see enforceHighestQuality
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError,
          onPlaybackQualityChange: onQualityChange,
        },
      });
    }

    function onPlayerReady(event) {
      console.log("DelayLivePlayer is ready!");
      event.target.playVideo(); // Autoplay on ready
      enforceHighestQuality(event.target);
      startQualityBurst();
      // Use stored times instead of re-reading from localStorage
      startDurationTimer(event.target, currentStartSeconds, currentEndSeconds);
    }

    // YouTube's IFrame API treats quality as a hint, not a guarantee — it can still
    // downgrade under bandwidth pressure. This runs on a fixed gigabit LAN with no
    // such constraint, so always pin to the highest tier YouTube offers for the
    // current video. getAvailableQualityLevels() is sorted highest → lowest (e.g.
    // hd2160, hd1440, hd1080, hd720, large, medium, small, tiny) but is only
    // populated once the video actually starts buffering, so this alone can't
    // always land the very first frame at the top tier — onQualityChange below
    // re-asserts it the moment YouTube reports its own (usually lower) auto-pick.
    function enforceHighestQuality(target) {
      try {
        const levels = target.getAvailableQualityLevels();
        target.setPlaybackQuality(levels && levels.length ? levels[0] : "highres");
      } catch (e) {
        console.warn("DelayLivePlayer: could not set playback quality:", e);
      }
    }

    // YouTube is most likely to silently downgrade quality in the first few
    // seconds after a video (re)loads, while it's still probing. The 1s backstop
    // further below only catches this every second — during this window, check
    // every 250ms instead so a downgrade gets reverted almost immediately rather
    // than sitting at the wrong tier for up to a second.
    let qualityBurstTimer = null;
    function startQualityBurst() {
      if (qualityBurstTimer) clearInterval(qualityBurstTimer);
      const deadline = Date.now() + 8000;
      qualityBurstTimer = setInterval(() => {
        if (!player || Date.now() > deadline) {
          clearInterval(qualityBurstTimer);
          qualityBurstTimer = null;
          return;
        }
        enforceHighestQuality(player);
      }, 250);
    }

    function onQualityChange(event) {
      if (!player) return;
      const levels = player.getAvailableQualityLevels();
      if (levels && levels.length && event.data !== levels[0]) {
        player.setPlaybackQuality(levels[0]);
      }
    }

    function onPlayerStateChange(event) {
      let state;
      switch (event.data) {
        case YT.PlayerState.ENDED:
          state = "ended";
          clearDurationTimer();
          // Only report videoEnded if not in loading state
          if (!isLoadingVideo) {
            // Report video ended event to the controller
            reportEvent("videoEnded", {
              videoId: player.getVideoData().video_id,
            });
            // Explicitly pause the video here, instead of looping, so the controller can take over
            if (player) {
              player.pauseVideo();
              console.log(
                "DelayLivePlayer: Video ended, paused and reported to controller."
              );
            }
          } else {
            console.log("DelayLivePlayer: Ignoring ENDED state during video loading.");
          }
          break;
        case YT.PlayerState.PLAYING:
          state = "playing";
          isLoadingVideo = false; // Video started playing, loading complete
          startQualityBurst(); // YouTube often re-picks quality right as playback actually starts
          // Use stored times instead of re-reading from localStorage
          startDurationTimer(event.target, currentStartSeconds, currentEndSeconds);
          break;
        case YT.PlayerState.PAUSED:
          state = "paused";
          clearDurationTimer();
          break;
        case YT.PlayerState.BUFFERING:
          state = "buffering";
          startQualityBurst(); // and again when it re-buffers (a common downgrade trigger)
          break;
        case YT.PlayerState.CUED:
          state = "cued";
          break;
        case YT.PlayerState.UNSTARTED:
          state = "unstarted";
          break;
        default:
          state = "unknown";
      }
      console.log("DelayLivePlayer state changed:", state);
    }

    function onPlayerError(event) {
      console.error("DelayLivePlayer error:", event.data);
      clearDurationTimer();
      reportEvent("videoError", {
        error: event.data,
        videoId: player ? player.getVideoData().video_id : "N/A",
      });
    }

    // Modified to receive start and end seconds directly, so it uses the *current* effective range
    function startDurationTimer(playerInstance, startSec, endSec) {
      clearDurationTimer(); // Clear any existing timer

      const hasEnd = endSec !== null && endSec !== undefined && endSec > 0;
      // Run the watcher when there is an end time OR skip sections to enforce.
      // Skip bounds are read from the global each tick so a setSkipRanges that
      // arrives while already playing takes effect without restarting the timer.
      if (hasEnd || skipRanges.length > 0) {
        durationTimer = setInterval(() => {
          const currentTime = playerInstance.getCurrentTime();
          // Inside a skip section → jump over it, never show it
          for (const range of skipRanges) {
            if (currentTime >= range.start && currentTime < range.end) {
              // Infinity = keyword was the last timestamp: finish the video here,
              // exactly like reaching the end time
              if (range.end === Infinity) {
                console.log(
                  `DelayLivePlayer: Reached last-chapter skip at ${range.start}s. Finishing video.`
                );
                reportEvent("videoEnded", {
                  videoId: playerInstance.getVideoData().video_id,
                });
                playerInstance.pauseVideo();
                clearDurationTimer();
                return;
              }
              console.log(
                `DelayLivePlayer: Skipping section ${range.start}s → ${range.end}s.`
              );
              playerInstance.seekTo(range.end, true);
              return;
            }
          }
          // If current time exceeds endSeconds, report to controller and pause
          if (hasEnd && currentTime >= endSec) {
            console.log(
              `DelayLivePlayer: Reached end time ${endSec}. Reporting 'videoEnded' to controller.`
            );
            reportEvent("videoEnded", {
              videoId: playerInstance.getVideoData().video_id,
            });
            playerInstance.pauseVideo(); // Pause the video
            clearDurationTimer(); // Stop checking once ended
          }
        }, 500); // Check every 500ms
      }
    }

    function clearDurationTimer() {
      if (durationTimer) {
        clearInterval(durationTimer);
        durationTimer = null;
      }
    }

    // Function to report events back to the main controller
    function reportEvent(eventName, data = {}) {
      const eventData = {
        playerType: "delay",
        event: eventName,
        timestamp: Date.now(),
        ...data,
      };
      localStorage.setItem(EVENT_REPORT_KEY, JSON.stringify(eventData));
      // Clear the item after a short delay to ensure the 'storage' event fires cleanly
      setTimeout(() => {
        localStorage.removeItem(EVENT_REPORT_KEY);
      }, 100);
    }

    // Event listener for changes in localStorage
    window.addEventListener("storage", (event) => {
      if (event.key === PLAYER_KEY && event.newValue) {
        try {
          const commandData = JSON.parse(event.newValue);
          if (commandData && commandData.command) {
            console.log("DelayLivePlayer received command:", commandData);
            switch (commandData.command) {
              case "loadVideo":
                // Safety check: ensure YT API is ready
                if (typeof YT === "undefined" || typeof YT.Player === "undefined") {
                  console.error("DelayLivePlayer: YouTube IFrame API (YT.Player) is not yet ready. Cannot create player.");
                  return;
                }

                const videoId = commandData.videoId;
                const startSeconds =
                  commandData.startSeconds !== undefined
                    ? parseInt(commandData.startSeconds)
                    : 0;
                const endSeconds =
                  commandData.endSeconds !== undefined && commandData.endSeconds > 0
                    ? parseInt(commandData.endSeconds)
                    : null;

                if (videoId) {
                  // Store times in variables
                  currentStartSeconds = startSeconds;
                  currentEndSeconds = endSeconds;
                  // New load clears any previous skip sections — the controller
                  // re-sends setSkipRanges for the new video if needed
                  skipRanges = [];
                  isLoadingVideo = true; // Set loading flag
                  lastLoadedVideoId = videoId;

                  if (player && typeof player.loadVideoById === 'function') {
                    // Reuse existing player for efficiency
                    console.log(`DelayLivePlayer: Loading video ${videoId} via loadVideoById from ${startSeconds} to ${endSeconds}`);
                    player.loadVideoById({
                      videoId: videoId,
                      startSeconds: startSeconds,
                      endSeconds: endSeconds || undefined,
                      suggestedQuality: "hd1080" // best-effort initial quality hint
                    });
                    startQualityBurst();
                    // Start duration timer for custom end handling
                    startDurationTimer(player, startSeconds, endSeconds);
                  } else {
                    // Create new player
                    createPlayer(videoId, startSeconds, endSeconds);
                    console.log(`DelayLivePlayer: Created new player for video ${videoId} from ${startSeconds} to ${endSeconds}`);
                  }
                } else {
                  console.warn("DelayLivePlayer: No videoId provided for loadVideo command.");
                }
                break;
              case "setSkipRanges":
              case "setSkipRange": // legacy single-range form (skip bounds in startSeconds/endSeconds)
                {
                  // Preferred form: commandData.skipRanges = [{ start, end }, ...]
                  // where end = null/0 means "finish the video at start" (last timestamp).
                  const rawRanges = Array.isArray(commandData.skipRanges)
                    ? commandData.skipRanges
                    : [{ start: commandData.startSeconds, end: commandData.endSeconds }];
                  skipRanges = [];
                  for (const raw of rawRanges) {
                    const start = parseInt(raw.start);
                    const noEnd = raw.end === null || raw.end === undefined || raw.end === 0;
                    const end = noEnd ? Infinity : parseInt(raw.end);
                    if (!isNaN(start) && start >= 0 && (end === Infinity || (!isNaN(end) && end > start))) {
                      skipRanges.push({ start, end });
                    }
                  }
                  skipRanges.sort((a, b) => a.start - b.start);
                  console.log(
                    "DelayLivePlayer: Skip sections set:",
                    skipRanges.map((r) => `${r.start}s→${r.end === Infinity ? "finish" : r.end + "s"}`).join(", ") || "(none)"
                  );
                  // Ensure the watcher is running (it may not be if no end time was set)
                  if (player && !durationTimer && skipRanges.length > 0) {
                    startDurationTimer(player, currentStartSeconds, currentEndSeconds);
                  }
                }
                break;
              case "play":
                if (player) {
                  player.playVideo();
                  // Retrieve last loaded start/end times to re-establish timer
                  const lastLoadCommand = JSON.parse(
                    localStorage.getItem(PLAYER_KEY) || "{}"
                  );
                  const lastStartSec =
                    lastLoadCommand.startSeconds !== undefined
                      ? parseInt(lastLoadCommand.startSeconds)
                      : 0;
                  const lastEndSec =
                    lastLoadCommand.endSeconds !== undefined
                      ? parseInt(lastLoadCommand.endSeconds)
                      : null;
                  startDurationTimer(player, lastStartSec, lastEndSec);
                }
                break;
              case "pause":
                if (player) {
                  player.pauseVideo();
                  clearDurationTimer(); // Stop timer on pause
                }
                break;
              case "stop":
                if (player) {
                  player.stopVideo();
                  clearDurationTimer(); // Stop timer on stop
                  player.destroy(); // Destroy player to clear current video
                  player = null;
                }
                break;
              case "mute":
                if (player) {
                  player.mute();
                }
                break;
              case "unmute":
                if (player) {
                  player.unMute();
                }
                break;
              case "destroy":
                // 24/7 Reliability: Clear intervals before destroy
                if (timeUpdateInterval) {
                  clearInterval(timeUpdateInterval);
                  timeUpdateInterval = null;
                }
                if (player) {
                  player.destroy();
                  player = null;
                }
                clearDurationTimer(); // Clear timer if player is destroyed
                break;
            }
          }
        } catch (e) {
          console.error(
            "Error parsing localStorage command for DelayLivePlayer:",
            e
          );
        }
      }
    });
    // 24/7 Reliability: Store interval ID for cleanup
    timeUpdateInterval = setInterval(() => {
      // FIX 3: Add a guard clause to ensure the player object exists and is ready
      if (!player || typeof player.getPlayerState !== "function") {
        return;
      }
      // Read duration fresh every tick — caching it once made every later
      // video inherit the first video's duration (and remaining time went
      // negative, which the controller renders as a blank).
      const duration = player.getDuration();
      const currentTime = player.getCurrentTime();
      // getDuration() returns 0 until the video's metadata is loaded — skip until then
      if (player.getPlayerState() === YT.PlayerState.PLAYING && duration > 0) {
        reportEvent("timeUpdate", {
          currentTime,
          duration,
          remainingTime: Math.max(0, duration - currentTime)
        });
        // onPlaybackQualityChange doesn't always fire when YouTube silently
        // holds a video at a lower tier, so piggyback a re-check on this
        // already-running 1s tick as a backstop to the event-driven enforcement.
        const levels = player.getAvailableQualityLevels();
        if (levels && levels.length && player.getPlaybackQuality() !== levels[0]) {
          player.setPlaybackQuality(levels[0]);
        }
      }
    }, 1000);

    // Load the YouTube API when the page loads
    loadYouTubeAPI();
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Unified Player</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
  }
  .player-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    visibility: hidden;
  }
  .player-wrap.active {
    visibility: visible;
  }
  .player-wrap iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  // One OBS Browser Source drives all four players from here. Only one is ever
  // shown/heard at a time — which one is decided by the "obs.activeSource" key in
  // the shared state service (server.cjs / state-service.cjs), the same value the
  // control panel already writes via OBSContext.setSourceVisibility(). This page
  // just watches that key over /ws and switches locally; it never talks to OBS.

  // All four pages load once here and are never torn down or reloaded — this
  // matches exactly how the old 4-separate-OBS-source setup behaved (each page
  // ran continuously; OBS only hid/showed it). That parity matters because none
  // of these pages know how to resume on their own: they only react to a fresh
  // "loadVideo" localStorage command from the control panel, they don't reload
  // their last state on page load. Destroying/recreating the iframe on switch
  // (an earlier version of this file did that for Live/Local) left them with an
  // empty <video> and no way to recover without the operator re-clicking Load.
  // cmdKey / stateKey are how this page silences the players that are off air.
  // In the old 4-scene-item layout OBS did that for free: a disabled scene item
  // produced no audio. Here there is one always-visible browser source, so every
  // player's audio is mixed into it and muting is entirely this page's job.
  const SOURCES = {
    "Loop Player":  { url: "/LoopPlayer.html",    cmdKey: "loopPlayerCommand",      stateKey: "player.loop"  },
    "Live Player":  { url: "/LivePlayer.html",    cmdKey: "livePlayerCommand",      stateKey: "player.live"  },
    "Delay Live":   { url: "/DelayLive.html",     cmdKey: "delayLivePlayerCommand", stateKey: "player.delay" },
    "Local Player": { url: "/LocalPCPlayer.html", cmdKey: "localPCPlayerCommand",   stateKey: "player.local" }
  };

  const root = document.getElementById("root");
  const wraps = {};
  const iframes = {};

  for (const key of Object.keys(SOURCES)) {
    const cfg = SOURCES[key];
    const wrap = document.createElement("div");
    wrap.className = "player-wrap";
    wrap.dataset.source = key;

    const iframe = document.createElement("iframe");
    iframe.setAttribute("allow", "autoplay");
    iframe.setAttribute("allowfullscreen", "true");
    iframe.src = cfg.url;

    wrap.appendChild(iframe);
    root.appendChild(wrap);
    wraps[key] = wrap;
    iframes[key] = iframe;
  }

  // Operator's own mute preference per player, mirrored from the shared state service
  // (player.loop.isMuted etc. — the same flag the player cards write). Going off air
  // always mutes; coming on air only unmutes a player the operator hasn't deliberately
  // muted, so this can't fight the mute button on the card.
  const mutePreference = {};

  function applyStateMutePrefs(state) {
    if (!state) return;
    for (const key of Object.keys(SOURCES)) {
      const entry = state[SOURCES[key].stateKey];
      if (entry && typeof entry.isMuted === "boolean") mutePreference[key] = entry.isMuted;
    }
  }

  // Player pages accept "mute"/"unmute" over the same localStorage command channel the
  // control panel uses, and act on them through whatever API they own — crucially
  // YT.Player.mute() for the YouTube-based players. Reaching into <video> elements is
  // not enough: LoopPlayer.html and DelayLive.html contain no <video> at all (the
  // YouTube player lives in a nested cross-origin iframe), so the old direct approach
  // silently did nothing for them and their audio bled over whatever was on air.
  function sendCommand(cmdKey, command) {
    try {
      localStorage.setItem(cmdKey, JSON.stringify({ command: command, startSeconds: 0, endSeconds: 0 }));
      setTimeout(() => { localStorage.removeItem(cmdKey); }, 100);
    } catch (e) {
      // Storage unavailable — nothing else we can do from here.
    }
  }

  function setMuted(name, muted) {
    const cfg = SOURCES[name];
    if (!cfg) return;

    // Direct <video> muting stays as the instant path for the HLS/local players — it
    // takes effect without waiting on the player page's command loop.
    try {
      const doc = iframes[name].contentDocument;
      if (doc) doc.querySelectorAll("video").forEach((v) => { v.muted = muted; });
    } catch (e) {
      // Not-yet-loaded — the command below still reaches it once ready.
    }

    if (muted) {
      sendCommand(cfg.cmdKey, "mute");
    } else if (mutePreference[name] !== true) {
      sendCommand(cfg.cmdKey, "unmute");
    }
  }

  let currentActive = null;

  function activateSource(name) {
    if (!SOURCES[name] || name === currentActive) return;
    currentActive = name;

    for (const key of Object.keys(SOURCES)) {
      const isActive = key === name;
      wraps[key].classList.toggle("active", isActive);
      setMuted(key, !isActive);
    }
  }

  // Re-apply mute state once each iframe finishes its one-time initial load —
  // covers the case where activateSource() ran before the player was ready.
  for (const key of Object.keys(SOURCES)) {
    iframes[key].addEventListener("load", () => {
      setMuted(key, key !== currentActive);
    });
  }

  function connectWebSocket() {
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocol}//${location.host}/ws`);

    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }

      if (msg.type === "STATE_SYNC") {
        applyStateMutePrefs(msg.data);
        const value = msg.data && msg.data["obs.activeSource"];
        if (value) activateSource(value);
      } else if (msg.type === "STATE_CHANGE") {
        const d = msg.data;
        if (d.type === "SET" && d.key === "obs.activeSource") {
          activateSource(d.value);
        } else if (d.type === "SET" && d.value && typeof d.value === "object") {
          // A player card saved its own state — pick up any change to its mute flag.
          applyStateMutePrefs({ [d.key]: d.value });
        } else if (d.type === "SET_MULTIPLE" && Array.isArray(d.changes)) {
          const asState = {};
          d.changes.forEach((c) => { asState[c.key] = c.value; });
          applyStateMutePrefs(asState);
          const change = d.changes.find((c) => c.key === "obs.activeSource");
          if (change) activateSource(change.value);
        } else if (d.type === "RESET" && d.state) {
          applyStateMutePrefs(d.state);
          const value = d.state["obs.activeSource"];
          if (value) activateSource(value);
        }
      }
    };

    ws.onclose = () => {
      setTimeout(connectWebSocket, 3000);
    };

    ws.onerror = () => {
      ws.close();
    };
  }

  // Resolve the initial state over plain HTTP first so the right player is showing
  // immediately, without waiting on the WebSocket handshake. Pull the whole state so the
  // operator's per-player mute preferences are known before the first switch.
  fetch("/api/state")
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      const state = (data && data.state) || {};
      applyStateMutePrefs(state);
      activateSource(state["obs.activeSource"] || "Loop Player");
    })
    .catch(() => activateSource("Loop Player"));

  connectWebSocket();
})();
</script>
</body>
</html>
